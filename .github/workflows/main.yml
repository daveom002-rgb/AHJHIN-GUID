name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Clean Flutter Project &amp; Merge Files
        run: |
          python3 -c '
          import os, shutil, subprocess, re

          # 1. Dynamically locate project folder containing pubspec.yaml
          src_dir = None
          for root, dirs, files in os.walk("."):
              if "pubspec.yaml" in files and "lib" in dirs and "temp_app" not in root:
                  src_dir = root
                  break

          if not src_dir:
              raise RuntimeError("Could not find pubspec.yaml and lib directory in repository.")

          print(f"Source files found in: {src_dir}")

          # 2. Generate clean Flutter Android project structure
          [suspicious link removed](["flutter", "create", "temp_app", "--org", "com.maya", "--project-name", "app", "--platforms", "android"], check=True)

          temp_app = "temp_app"

          # 3. Copy custom pubspec.yaml and lib folder
          shutil.copy(os.path.join(src_dir, "pubspec.yaml"), os.path.join(temp_app, "pubspec.yaml"))
          shutil.copytree(os.path.join(src_dir, "lib"), os.path.join(temp_app, "lib"), dirs_exist_ok=True)

          # 4. Copy custom Xiaomi Kotlin background services
          kotlin_dst = os.path.join(temp_app, "android", "app", "src", "main", "kotlin", "com", "maya", "app")
          os.makedirs(kotlin_dst, exist_ok=True)

          kotlin_src = os.path.join(src_dir, "android", "app", "src", "main", "kotlin")
          if os.path.exists(kotlin_src):
              for root, dirs, files in os.walk(kotlin_src):
                  for file in files:
                      if file.endswith(".kt"):
                          shutil.copy(os.path.join(root, file), os.path.join(kotlin_dst, file))

          # 5. Copy custom AndroidManifest.xml
          manifest_src = os.path.join(src_dir, "android", "app", "src", "main", "AndroidManifest.xml")
          if os.path.exists(manifest_src):
              shutil.copy(manifest_src, os.path.join(temp_app, "android", "app", "src", "main", "AndroidManifest.xml"))

          # 6. Fix MayaXiaomiService NotificationManager type cast
          service_file = os.path.join(kotlin_dst, "MayaXiaomiService.kt")
          if os.path.exists(service_file):
              with open(service_file, "r") as f:
                  code = [suspicious link removed]()
              code = code.replace("as Manager", "as NotificationManager")
              with open(service_file, "w") as f:
                  f.write(code)

          # 7. Create required Android resources
          res_dir = os.path.join(temp_app, "android", "app", "src", "main", "res")
          os.makedirs(os.path.join(res_dir, "drawable"), exist_ok=True)
          os.makedirs(os.path.join(res_dir, "layout"), exist_ok=True)
          os.makedirs(os.path.join(res_dir, "raw"), exist_ok=True)
          os.makedirs(os.path.join(res_dir, "values"), exist_ok=True)

          with open(os.path.join(res_dir, "values", "styles.xml"), "w") as f:
              f.write("""
          """)

          with open(os.path.join(res_dir, "drawable", "ic_stat_maya.xml"), "w") as f:
              f.write("""
          """)

          with open(os.path.join(res_dir, "layout", "layout_maya_overlay.xml"), "w") as f:
              f.write("""
          """)

          with open(os.path.join(res_dir, "raw", "maya_chime_loud.wav"), "wb") as f:
              f.write(b"RIFF\x24\x00\x00\x00WAVEfmt \x10\x00\x00\x00\x01\x00\x01\x00\x44\xac\x00\x00\x88\x58\x01\x00\x02\x00\x10\x00data\x00\x00\x00\x00")

          # 8. Set compileSdk = 34 in build.gradle
          for file in ["build.gradle", "build.gradle.kts"]:
              p = os.path.join(temp_app, "android", "app", file)
              if os.path.exists(p):
                  with open(p, "r") as f:
                      c = [suspicious link removed]()
                  c = re.sub(r"compileSdk\s*=?\s*.*", "compileSdk = 34", c)
                  c = re.sub(r"compileSdkVersion\s*.*", "compileSdkVersion 34", c)
                  with open(p, "w") as f:
                      f.write(c)
          '

      - name: Install Dependencies
        run: |
          cd temp_app
          flutter pub get

      - name: Build Debug APK
        run: |
          cd temp_app
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maya-redmi-apk
          path: temp_app/build/app/outputs/flutter-apk/app-debug.apk

