name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Clean Project &amp; Merge Source Files
        run: |
          # 1. Generate clean Android structure with package [suspicious link removed]
          flutter create temp_app --org com.maya --project-name app --platforms=android

          # 2. Copy custom Dart files and pubspec
          cp -r lib/* temp_app/lib/
          cp pubspec.yaml temp_app/pubspec.yaml

          # 3. Copy custom Xiaomi Kotlin files and AndroidManifest
          cp -r android/app/src/main/kotlin/com/maya/app/* temp_app/android/app/src/main/kotlin/com/maya/app/
          cp android/app/src/main/AndroidManifest.xml temp_app/android/app/src/main/AndroidManifest.xml

          # 4. Create required Android resources
          mkdir -p temp_app/android/app/src/main/res/drawable
          mkdir -p temp_app/android/app/src/main/res/layout
          mkdir -p temp_app/android/app/src/main/res/raw
          mkdir -p temp_app/android/app/src/main/res/values

          cat &lt;&lt; 'EOF' &gt; temp_app/android/app/src/main/res/values/styles.xml
          
          
          EOF

          cat &lt;&lt; 'EOF' &gt; temp_app/android/app/src/main/res/drawable/ic_stat_maya.xml
          
          
          EOF

          cat &lt;&lt; 'EOF' &gt; temp_app/android/app/src/main/res/layout/layout_maya_overlay.xml
          
          
          EOF

          printf 'RIFF\x24\x00\x00\x00WAVEfmt \x10\x00\x00\x00\x01\x00\x01\x00\x44\xac\x00\x00\x88\x58\x01\x00\x02\x00\x10\x00data\x00\x00\x00\x00' &gt; temp_app/android/app/src/main/res/raw/maya_chime_loud.wav

          # 5. Set Android compileSdk version to 34
          if [ -f temp_app/android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = .*/compileSdk = 34/g' temp_app/android/app/build.gradle.kts
          fi
          if [ -f temp_app/android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' temp_app/android/app/build.gradle
          fi

      - name: Install Dependencies
        run: |
          cd temp_app
          flutter pub get

      - name: Build Debug APK
        run: |
          cd temp_app
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maya-redmi-apk
          path: temp_app/build/app/outputs/flutter-apk/app-debug.apk
