name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.x'

      - name: Backup custom source files
        run: |
          mkdir -p /tmp/maya_backup
          cp -r android/app/src/main/kotlin /tmp/maya_backup/ 2&gt;/dev/null || true
          cp android/app/src/main/AndroidManifest.xml /tmp/maya_backup/ 2&gt;/dev/null || true
          cp -r lib /tmp/maya_backup/ 2&gt;/dev/null || true
          cp pubspec.yaml /tmp/maya_backup/ 2&gt;/dev/null || true

      - name: Generate Android Gradle structure
        run: flutter create . --org com.maya --project-name maya_app --platforms=android --overwrite

      - name: Restore custom source files
        run: |
          cp -r /tmp/maya_backup/kotlin/* android/app/src/main/kotlin/ 2&gt;/dev/null || true
          cp /tmp/maya_backup/AndroidManifest.xml android/app/src/main/ 2&gt;/dev/null || true
          cp -r /tmp/maya_backup/lib/* lib/ 2&gt;/dev/null || true
          cp /tmp/maya_backup/pubspec.yaml ./ 2&gt;/dev/null || true

      - name: Configure Android resources
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/raw
          mkdir -p android/app/src/main/res/values

          cat &lt;&lt; 'EOF' &gt; android/app/src/main/res/values/styles.xml
          
          
          EOF

          cat &lt;&lt; 'EOF' &gt; android/app/src/main/res/drawable/ic_stat_maya.xml
          
          
          EOF

          cat &lt;&lt; 'EOF' &gt; android/app/src/main/res/layout/layout_maya_overlay.xml
          
          
          EOF

          touch android/app/src/main/res/raw/maya_chime_loud.wav

      - name: Configure Android Package Namespace
        run: |
          sed -i 's/as Manager/as NotificationManager/g' android/app/src/main/kotlin/com/maya/app/MayaXiaomiService.kt 2&gt;/dev/null || true
          
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/namespace = ".*"/namespace = "[suspicious link removed]"/g' android/app/build.gradle.kts
            sed -i 's/applicationId = ".*"/applicationId = "[suspicious link removed]"/g' android/app/build.gradle.kts
            sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/namespace .*/namespace "[suspicious link removed]"/g' android/app/build.gradle
            sed -i 's/applicationId .*/applicationId "[suspicious link removed]"/g' android/app/build.gradle
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maya-redmi-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          
