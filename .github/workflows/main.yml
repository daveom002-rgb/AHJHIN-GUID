name: Build Android APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Backup custom source files
        run: |
          mkdir -p /tmp/maya_backup
          cp -r android/app/src/main/kotlin /tmp/maya_backup/ 2&gt;/dev/null || true
          cp android/app/src/main/AndroidManifest.xml /tmp/maya_backup/ 2&gt;/dev/null || true
          cp -r lib /tmp/maya_backup/ 2&gt;/dev/null || true
          cp pubspec.yaml /tmp/maya_backup/ 2&gt;/dev/null || true

      - name: Generate Android Gradle structure
        run: flutter create . --org com.maya --project-name maya_app --platforms=android --overwrite

      - name: Restore custom source files
        run: |
          cp -r /tmp/maya_backup/kotlin/* android/app/src/main/kotlin/ 2&gt;/dev/null || true
          cp /tmp/maya_backup/AndroidManifest.xml android/app/src/main/ 2&gt;/dev/null || true
          cp -r /tmp/maya_backup/lib/* lib/ 2&gt;/dev/null || true
          cp /tmp/maya_backup/pubspec.yaml ./ 2&gt;/dev/null || true

      - name: Fix Kotlin code issues &amp; namespace
        run: |
          sed -i 's/as Manager/as NotificationManager/g' android/app/src/main/kotlin/com/maya/app/MayaXiaomiService.kt 2&gt;/dev/null || true
          
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E 's/namespace[ =]+["'\''][^"'\'']+["'\'']/namespace = "[suspicious link removed]"/g' "$f" 2&gt;/dev/null || true
              sed -i -E 's/applicationId[ =]+["'\''][^"'\'']+["'\'']/applicationId = "[suspicious link removed]"/g' "$f" 2&gt;/dev/null || true
              sed -i -E 's/compileSdk[ =]+[a-zA-Z0-9._]+/compileSdk = 34/g' "$f" 2&gt;/dev/null || true
            fi
          done

      - name: Create required Android resources
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/raw
          mkdir -p android/app/src/main/res/values

          cat &lt;&lt; 'EOF' &gt; android/app/src/main/res/values/styles.xml
          
          
          EOF

          cat &lt;&lt; 'EOF' &gt; android/app/src/main/res/drawable/ic_stat_maya.xml
          
          
          EOF

          cat &lt;&lt; 'EOF' &gt; android/app/src/main/res/layout/layout_maya_overlay.xml
          
          
          EOF

          printf 'RIFF\x24\x00\x00\x00WAVEfmt \x10\x00\x00\x00\x01\x00\x01\x00\x44\xac\x00\x00\x88\x58\x01\x00\x02\x00\x10\x00data\x00\x00\x00\x00' &gt; android/app/src/main/res/raw/maya_chime_loud.wav

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maya-redmi-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
